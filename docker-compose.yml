
networks:
  app-net1:
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1

services:

  mysql8:
    image: mysql:8.3.0
    container_name: mysql8
    # Port mapping
    ports:
      - "3306:3306"
    # Container environment variables
    environment:
      # root Password
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      # Database to initialize (later init SQL runs in this database)
      - MYSQL_DATABASE=${MYSQL_DATABASE:-tenanthub_master}
      # User to initialize (cannot be root; grant it privileges afterwards)
      - MYSQL_USER=${MYSQL_USER:-tenanthub}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - /data/mysql8/data/:/var/lib/mysql/
      - /data/mysql8/conf/:/etc/mysql/conf.d/
      # Mount the init SQL directory,
      # - /data/mysql8/init/:/docker-entrypoint-initdb.d/
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
      --log-bin=mysql-bin
      --server_id=1
      --default-time-zone=+00:00
    restart: always
    networks:
      app-net1:
        ipv4_address: 172.19.0.11
    deploy:
      resources:
        limits:
          memory: 2g


  redis7:
    image: redis:7.2.4
    container_name: redis7
    ports:
      - "6379:6379"
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - /data/redis7/data:/data
      - /data/redis7/conf/redis.conf:/etc/redis/redis.conf
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env} --appendonly yes
    privileged: true
    restart: always
    networks:
      app-net1:
        ipv4_address: 172.19.0.21
    deploy:
      resources:
        limits:
          memory: 1g


  nginx:
    image: nginx:1.25.4
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - /data/nginx/cert:/cert
      - /data/nginx/html:/html
      - /data/nginx/logs:/var/log/nginx
      - /data/nginx/nginx.conf:/etc/nginx/nginx.conf
    restart: always
    privileged: true
    networks:
      app-net1:
        ipv4_address: 172.19.0.31
    deploy:
      resources:
        limits:
          memory: 512m


  tenanthub:
    image: eclipse-temurin:21-jre-jammy
    container_name: tenanthub
    ports:
      - "18891:18891"
    environment:
      - SPRING_PROFILES_ACTIVE=pro
      # JWT secret + RSA key pair are generated in this directory on first start
      - JWT_TOKEN_KEYS_DIR=/keys
      - TENANTHUB_BOOTSTRAP_ADMIN_PASSWORD=${TENANTHUB_BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - /data/tenanthub/keys:/keys
      - /data/tenanthub/logs:/logs/tenanthub
      - /data/tenanthub/tenanthub-pro.jar:/app.jar
      - /data/tenanthub/application-pro.yml:/config/application-pro.yml
    command: java -server -Xms1g -Xmx1g -XX:+DisableExplicitGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Duser.timezone=UTC -Djava.security.egd=file:/dev/./urandom -jar /app.jar
    privileged: true
    restart: always
    networks:
      app-net1:
        ipv4_address: 172.19.0.41
    deploy:
      resources:
        limits:
          memory: 2g

