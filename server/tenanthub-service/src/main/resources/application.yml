server:
  # Render and similar hosts pass the port in PORT
  port: ${PORT:18891}

spring:
  profiles:
    active: dev
  application:
    name: tenanthub
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC
    default-property-inclusion: non_null
    locale: en_US
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  threads:
    virtual:
      enabled: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog-master.xml
    contexts: platform,tenant

  # Database and Redis. Defaults suit local development; set the environment variables in production.
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${multi.tenant.db-name}?sslMode=${DB_SSL_MODE:DISABLED}&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC&allowMultiQueries=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      # The database a connection is reset to when it returns to the pool, so a tenant's
      # database selected by SchemaInterceptor never leaks to the next request.
      catalog: ${multi.tenant.db-name}
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 5
      connection-test-query: SELECT 1

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:1}
      # Hosted Redis over the internet (e.g. Upstash) needs TLS: REDIS_SSL=true
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 5000
      lettuce:
        pool:
          max-idle: 8
          min-idle: 3
          max-active: 8
          max-wait: 500

  cache:
    type: redis
    redis:
      use-key-prefix: true
      time-to-live: 180s

  # SMTP for email sign-in codes (e.g. Amazon SES Mumbai, Zoho Mail, Gmail app password)
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${MAIL_STARTTLS:true}


# File storage (https://x-file-storage.xuyanwu.cn)
# STORAGE_PLATFORM=local-1 (default) stores files on disk and serves them at /files/**
# STORAGE_PLATFORM=s3-1 uses any S3-compatible store: AWS S3 (e.g. ap-south-1 Mumbai),
# DigitalOcean Spaces (blr1), MinIO, Cloudflare R2, ...
dromara:
  x-file-storage:
    default-platform: ${STORAGE_PLATFORM:local-1}
    thumbnail-suffix: ".min.jpg"
    local-plus:
      - platform: local-1
        enable-storage: true
        enable-access: false
        domain: ${STORAGE_LOCAL_DOMAIN:http://127.0.0.1:18891/files/}
        base-path: tenanthub/
        # Must be absolute: the storage library resolves relative paths against the classpath
        storage-path: ${STORAGE_LOCAL_PATH:${user.dir}/uploads/}
    amazon-s3:
      - platform: s3-1
        enable-storage: ${S3_ENABLED:false}
        access-key: ${S3_ACCESS_KEY:}
        secret-key: ${S3_SECRET_KEY:}
        region: ${S3_REGION:ap-south-1}
        end-point: ${S3_ENDPOINT:}
        bucket-name: ${S3_BUCKET:}
        domain: ${S3_PUBLIC_URL:}
        base-path: tenanthub/

# Multi-tenant settings
multi:
  tenant:
    prefix: tenanthub_
    default-tenant-id: master
    default-project-id: 10001
    db-name: ${multi.tenant.prefix}${multi.tenant.default-tenant-id}
    enable: true
    enable-project: true
    create-table: true
    contexts: tenant
    change-log: ${spring.liquibase.change-log}


jwt:
  token:
    # The JWT secret and RSA key pair are generated here on first start. Keep this directory private and persistent.
    keys-dir: ./keys


# mybatis-plus Auto-configuration
mybatis-plus:
  type-aliases-package: com.abhishek.tenanthub.*.entity
  configuration:
    default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler


info:
  app:
    name: ${spring.application.name}
    description: Spring Boot 3.X + Mybatis-Plus + Liquibase SaaS
    version: 1.0.1


# /actuator/** needs no login, so only expose harmless endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
    shutdown:
      access: none
  health:
    # SMTP is optional; don't report the app as down when it isn't configured
    mail:
      enabled: false


tenanthub:
  app-name: TenantHub
  # Websites allowed to call the API from the browser, comma-separated
  # (e.g. https://admin.example.com,https://portal.example.com). "*" allows any website.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  # One-time sign-in codes
  otp:
    length: 6
    ttl: 5m
    resend-interval: 60s
    max-attempts: 5
    max-sends-per-hour: 5
    # Print codes to the log when no email/SMS provider is configured (dev profile only)
    log-codes: false
    mail-from: ${MAIL_FROM:}
    # SMS via MSG91 (needs a DLT-approved template with an "otp" variable)
    msg91:
      auth-key: ${MSG91_AUTH_KEY:}
      template-id: ${MSG91_TEMPLATE_ID:}
      otp-variable: ${MSG91_OTP_VARIABLE:otp}
  # Subscription billing
  billing:
    gst-rate: 18
    # GST state code of your business (first two digits of your GSTIN): CGST+SGST for buyers in
    # the same state, IGST otherwise. 29 = Karnataka, 27 = Maharashtra, 07 = Delhi, ...
    seller-state-code: ${GST_SELLER_STATE_CODE:29}
    invoice-prefix: ${INVOICE_PREFIX:TH}
  # Razorpay (test keys start with rzp_test_). Webhook URL: https://your-api-domain/razorpay/webhook
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}


# The file storage library logs its startup messages in Chinese; keep only its warnings and errors
logging:
  level:
    "[org.dromara.x.file.storage]": WARN
