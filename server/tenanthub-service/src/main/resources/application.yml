server:
  port: 18891

spring:
  profiles:
    active: dev
  application:
    name: tenanthub
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC
    default-property-inclusion: non_null
    locale: en_US
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  threads:
    virtual:
      enabled: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog-master.xml
    contexts: platform,tenant

ip2region:
  external: false
  location: classpath*:ip2region.xdb

# Multi-tenant settings
multi:
  tenant:
    prefix: tenanthub_
    default-tenant-id: master
    default-project-id: 10001
    db-name: ${multi.tenant.prefix}${multi.tenant.default-tenant-id}
    enable: true
    enable-project: true
    create-table: true
    contexts: tenant
    change-log: ${spring.liquibase.change-log}


jwt:
  token:
    # The JWT secret and RSA key pair are generated here on first start. Keep this directory private and persistent.
    keys-dir: ./keys


# mybatis-plus Auto-configuration
mybatis-plus:
  type-aliases-package: com.abhishek.tenanthub.*.entity
  configuration:
    default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler


info:
  app:
    name: ${spring.application.name}
    description: Spring Boot 3.X + Mybatis-Plus + Liquibase SaaS
    version: 1.0.1


management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: ALWAYS
    shutdown:
      enabled: true
