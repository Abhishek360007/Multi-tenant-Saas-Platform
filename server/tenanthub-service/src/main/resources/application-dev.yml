# Local development. Connection settings come from application.yml (localhost defaults);
# put personal overrides in application-local.yml (git-ignored) and run with
# --spring.profiles.active=dev,local
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Without SMTP/MSG91 settings, sign-in codes are printed to the server log so OTP login can be tried locally
tenanthub:
  otp:
    log-codes: true
